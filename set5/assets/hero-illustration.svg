<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroIllustrationTitle">
  <title id="heroIllustrationTitle">Illustration of the Nimbus product dashboard showing tasks, a document preview, a team chat and a weekly activity chart, with a small person looking on</title>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      .illust-dot,
      .illust-dashboard,
      .illust-card,
      .illust-checkmark,
      .illust-bar,
      .illust-float-chip,
      .illust-character {
        opacity: 0;
      }

      .illust-dashboard,
      .illust-card,
      .illust-float-chip,
      .illust-character,
      .illust-bar,
      .illust-pulse-dot {
        transform-box: fill-box;
        transform-origin: center;
      }

      .illust-bar {
        transform-origin: center bottom;
      }

      .illust-dashboard {
        transform: scale(0.96);
      }

      .illust-card {
        transform: scale(0.9) translateY(8px);
      }

      .illust-float-chip {
        transform: scale(0.7);
      }

      .illust-character {
        transform: scale(0.9) translateY(10px);
      }

      .illust-bar {
        transform: scaleY(0);
      }

      .illust-checkmark {
        stroke-dasharray: 16;
        stroke-dashoffset: 16;
      }

      .illust-dashboard {
        animation: illust-dashboard-in 0.55s ease forwards;
        animation-delay: 0.5s;
      }

      .illust-dot {
        animation: illust-pop-in 0.3s ease forwards;
      }

      .illust-dot-1 {
        animation-delay: 0.75s;
      }

      .illust-dot-2 {
        animation-delay: 0.82s;
      }

      .illust-dot-3 {
        animation-delay: 0.89s;
      }

      .illust-card {
        animation: illust-tile-in 0.45s ease forwards;
      }

      .illust-card-tasks {
        animation-delay: 0.7s;
      }

      .illust-card-chat {
        animation-delay: 0.75s;
      }

      .illust-card-doc {
        animation-delay: 0.82s;
      }

      .illust-card-chart {
        animation-delay: 0.88s;
      }

      .illust-checkmark {
        animation: illust-check-draw 0.3s ease forwards;
      }

      .illust-checkmark-1 {
        animation-delay: 1s;
      }

      .illust-checkmark-2 {
        animation-delay: 1.1s;
      }

      .illust-bar {
        animation: illust-grow-bar 0.4s ease forwards;
      }

      .illust-bar-1 {
        animation-delay: 1s;
      }

      .illust-bar-2 {
        animation-delay: 1.06s;
      }

      .illust-bar-3 {
        animation-delay: 1.12s;
      }

      .illust-bar-4 {
        animation-delay: 1.18s;
      }

      .illust-bar-5 {
        animation-delay: 1.24s;
      }

      .illust-cursor {
        animation: illust-cursor-blink 1s step-end infinite;
        animation-delay: 1.3s;
      }

      .illust-float-chip {
        animation: illust-chip-in 0.4s ease forwards;
      }

      .illust-chip-notify {
        animation-delay: 1s;
      }

      .illust-chip-team {
        animation-delay: 1.1s;
      }

      .illust-chip-notify .illust-chip-body {
        animation: illust-idle-bob 3.6s ease-in-out infinite;
        animation-delay: 1.6s;
      }

      .illust-chip-team .illust-chip-body {
        animation: illust-idle-bob 4s ease-in-out infinite;
        animation-delay: 1.8s;
      }

      .illust-pulse-dot {
        animation: illust-pulse 2s ease-out infinite;
        animation-delay: 1.5s;
      }

      .illust-character {
        animation: illust-tile-in 0.5s ease forwards;
        animation-delay: 0.55s;
      }

      .illust-head-bob {
        animation: illust-idle-bob 3.2s ease-in-out infinite;
        animation-delay: 1.3s;
      }

      .illust-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: illust-blink 4.5s ease-in-out infinite;
        animation-delay: 2s;
      }
    }

    @keyframes illust-pop-in {
      from {
        opacity: 0;
        transform: scale(0.4);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes illust-dashboard-in {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes illust-tile-in {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes illust-chip-in {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes illust-check-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes illust-grow-bar {
      to {
        transform: scaleY(1);
      }
    }

    @keyframes illust-cursor-blink {
      0%,
      50% {
        opacity: 1;
      }

      50.01%,
      100% {
        opacity: 0;
      }
    }

    @keyframes illust-idle-bob {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes illust-pulse {
      0% {
        transform: scale(1);
        opacity: 0.9;
      }

      70% {
        transform: scale(2.1);
        opacity: 0;
      }

      100% {
        transform: scale(2.1);
        opacity: 0;
      }
    }

    @keyframes illust-blink {
      0%,
      92%,
      100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.1);
      }
    }
  </style>

  <defs>
    <radialGradient id="ill-bg-glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0" />
    </radialGradient>
    <filter id="ill-shadow-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.18" />
    </filter>
    <filter id="ill-shadow-md" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#312e81" flood-opacity="0.16" />
    </filter>
    <filter id="ill-shadow-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312e81" flood-opacity="0.10" />
    </filter>
  </defs>

  <ellipse cx="370" cy="230" rx="300" ry="240" fill="url(#ill-bg-glow)" />

  <g class="illust-character" transform="translate(19,222) scale(0.58)">
    <g class="illust-head-bob">
      <ellipse cx="106" cy="490" rx="90" ry="14" fill="#1a1f36" opacity="0.06" />
      <path d="M20,480 L20,342 C20,300 58,274 106,274 C154,274 192,300 192,342 L192,480 Z" fill="#4f46e5" />

      <rect x="90" y="250" width="32" height="40" fill="#f2c2a0" />
      <ellipse cx="106" cy="285" rx="30" ry="18" fill="#ffffff" />

      <ellipse cx="106" cy="205" rx="86" ry="80" fill="#2b2438" />
      <circle cx="55" cy="170" r="32" fill="#2b2438" />
      <circle cx="82" cy="148" r="35" fill="#2b2438" />
      <circle cx="112" cy="142" r="34" fill="#2b2438" />
      <circle cx="142" cy="152" r="32" fill="#2b2438" />
      <circle cx="162" cy="178" r="30" fill="#2b2438" />

      <circle cx="106" cy="225" r="62" fill="#f2c2a0" />

      <path d="M70,205 q12,-8 24,-2" stroke="#2b2438" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M142,205 q-12,-8 -24,-2" stroke="#2b2438" stroke-width="4" fill="none" stroke-linecap="round" />

      <g class="illust-eyes">
        <ellipse cx="82" cy="222" rx="10" ry="11" fill="#ffffff" />
        <ellipse cx="130" cy="222" rx="10" ry="11" fill="#ffffff" />
        <circle cx="85" cy="220" r="5.5" fill="#2b2438" />
        <circle cx="133" cy="220" r="5.5" fill="#2b2438" />
        <circle cx="87" cy="217.5" r="1.8" fill="#ffffff" />
        <circle cx="135" cy="217.5" r="1.8" fill="#ffffff" />
      </g>

      <path d="M86,252 q20,18 40,0" stroke="#2b2438" stroke-width="4" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <g class="illust-dashboard">
    <rect x="160" y="40" width="420" height="400" rx="24" fill="#f3f4fb" filter="url(#ill-shadow-lg)" />
    <path d="M160,64 C160,50.7 170.7,40 184,40 L556,40 C569.3,40 580,50.7 580,64 L580,84 L160,84 Z" fill="#ffffff" />
    <line x1="160" y1="84" x2="580" y2="84" stroke="#eceef6" stroke-width="1" />
    <circle class="illust-dot illust-dot-1" cx="184" cy="62" r="5" fill="#f87171" />
    <circle class="illust-dot illust-dot-2" cx="202" cy="62" r="5" fill="#fbbf24" />
    <circle class="illust-dot illust-dot-3" cx="220" cy="62" r="5" fill="#34d399" />
    <rect x="240" y="53" width="220" height="18" rx="9" fill="#eef0f7" />
    <rect x="250" y="58" width="8" height="8" rx="2" fill="#4f46e5" />
    <rect x="264" y="59" width="60" height="6" rx="3" fill="#c7cadb" />
  </g>

  <g class="illust-card illust-card-tasks">
    <rect x="180" y="104" width="230" height="150" rx="16" fill="#ffffff" stroke="#eceef6" stroke-width="1" filter="url(#ill-shadow-sm)" />
    <text x="196" y="130" font-size="13" font-weight="700" fill="#1a1f36">Today's tasks</text>
    <rect x="372" y="116" width="34" height="18" rx="9" fill="#eef1fe" />
    <text x="389" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5">3/5</text>
    <line x1="196" y1="140" x2="394" y2="140" stroke="#eceef6" stroke-width="1" />

    <rect x="196" y="150" width="16" height="16" rx="4" fill="#4f46e5" />
    <path class="illust-checkmark illust-checkmark-1" d="M199,158 l3,3 l7,-8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="222" y="155" width="130" height="7" rx="3.5" fill="#e5e7eb" />
    <line x1="222" y1="158.5" x2="352" y2="158.5" stroke="#c3c6d4" stroke-width="1" />

    <rect x="196" y="174" width="16" height="16" rx="4" fill="#4f46e5" />
    <path class="illust-checkmark illust-checkmark-2" d="M199,182 l3,3 l7,-8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="222" y="179" width="110" height="7" rx="3.5" fill="#e5e7eb" />
    <line x1="222" y1="182.5" x2="332" y2="182.5" stroke="#c3c6d4" stroke-width="1" />

    <rect x="196" y="198" width="16" height="16" rx="4" fill="#ffffff" stroke="#c7c7e0" stroke-width="2" />
    <rect x="222" y="203" width="150" height="7" rx="3.5" fill="#9098ac" />

    <rect x="196" y="222" width="16" height="16" rx="4" fill="#ffffff" stroke="#c7c7e0" stroke-width="2" />
    <rect x="222" y="227" width="120" height="7" rx="3.5" fill="#9098ac" />
  </g>

  <g class="illust-card illust-card-doc">
    <rect x="180" y="266" width="230" height="118" rx="16" fill="#ffffff" stroke="#eceef6" stroke-width="1" filter="url(#ill-shadow-sm)" />
    <rect x="196" y="282" width="32" height="32" rx="8" fill="#eef1fe" />
    <rect x="206" y="290" width="14" height="17" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="1.3" />
    <rect x="209" y="294" width="8" height="1.6" fill="#4f46e5" />
    <rect x="209" y="298" width="8" height="1.6" fill="#c7d2fe" />
    <text x="238" y="294" font-size="12" font-weight="600" fill="#1a1f36">Q3 Roadmap.docx</text>
    <text x="238" y="309" font-size="10" fill="#9098ac">Edited 2m ago</text>
    <rect x="196" y="328" width="200" height="6" rx="3" fill="#eef0f5" />
    <rect x="196" y="340" width="170" height="6" rx="3" fill="#eef0f5" />
    <rect x="196" y="352" width="185" height="6" rx="3" fill="#eef0f5" />
  </g>

  <g class="illust-card illust-card-chat">
    <rect x="422" y="104" width="138" height="150" rx="16" fill="#ffffff" stroke="#eceef6" stroke-width="1" filter="url(#ill-shadow-sm)" />
    <text x="434" y="128" font-size="12" font-weight="700" fill="#1a1f36">Team chat</text>
    <rect x="434" y="138" width="78" height="22" rx="11" fill="#f1f2f7" />
    <rect x="444" y="146" width="55" height="6" rx="3" fill="#c7c9d6" />
    <rect x="446" y="166" width="66" height="22" rx="11" fill="#4f46e5" />
    <rect x="454" y="174" width="46" height="6" rx="3" fill="#c7d2fe" />
    <rect x="434" y="216" width="112" height="22" rx="11" fill="#f7f8fb" stroke="#e5e7eb" stroke-width="1" />
    <rect class="illust-cursor" x="444" y="222" width="2" height="10" fill="#4f46e5" />
  </g>

  <g class="illust-card illust-card-chart">
    <rect x="422" y="266" width="138" height="118" rx="16" fill="#ffffff" stroke="#eceef6" stroke-width="1" filter="url(#ill-shadow-sm)" />
    <text x="434" y="286" font-size="11" font-weight="700" fill="#1a1f36">Activity</text>
    <text x="434" y="308" font-size="17" font-weight="700" fill="#4f46e5">+24%</text>
    <path d="M488,301 l5,-7 l5,7" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect class="illust-bar illust-bar-1" x="434" y="354" width="14" height="18" rx="3" fill="#c7d2fe" />
    <rect class="illust-bar illust-bar-2" x="456" y="344" width="14" height="28" rx="3" fill="#c7d2fe" />
    <rect class="illust-bar illust-bar-3" x="478" y="350" width="14" height="22" rx="3" fill="#c7d2fe" />
    <rect class="illust-bar illust-bar-4" x="500" y="338" width="14" height="34" rx="3" fill="#4f46e5" />
    <rect class="illust-bar illust-bar-5" x="522" y="346" width="14" height="26" rx="3" fill="#c7d2fe" />
  </g>

  <g class="illust-float-chip illust-chip-notify">
    <g class="illust-chip-body">
      <rect x="540" y="18" width="80" height="40" rx="14" fill="#ffffff" filter="url(#ill-shadow-md)" />
      <circle class="illust-pulse-dot" cx="558" cy="38" r="5" fill="#34d399" />
      <text x="572" y="42" font-size="11" font-weight="600" fill="#1a1f36">Synced</text>
    </g>
  </g>

  <g class="illust-float-chip illust-chip-team">
    <g class="illust-chip-body">
      <rect x="518" y="428" width="94" height="48" rx="18" fill="#ffffff" filter="url(#ill-shadow-md)" />
      <circle cx="538" cy="452" r="13" fill="#a5b4fc" stroke="#ffffff" stroke-width="2" />
      <circle cx="558" cy="452" r="13" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
      <circle cx="578" cy="452" r="13" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />
      <text x="578" y="456" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">+2</text>
    </g>
  </g>
</svg>
